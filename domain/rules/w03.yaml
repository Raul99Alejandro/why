id: W-03
rule: A decision with a concrete next step creates exactly one Bee todo; the todo is closed when a commit that matches that decision lands.
status: proposed
kind: judged
source: "owner, chat 2026-10-06 (approved the idea of follow-up todos); the examples below are proposed, to be confirmed"
examples:
